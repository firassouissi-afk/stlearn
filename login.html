<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — ST LEARN</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #718096;
      --blue: #4263eb;
      --blue-dark: #304cc4;
      --line: #e6ebf2;
      --background: #f4f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, rgba(109, 130, 255, .22), transparent 32%),
        radial-gradient(circle at 90% 85%, rgba(66, 99, 235, .16), transparent 35%),
        var(--background);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .login-card {
      width: min(410px, 100%);
      padding: 36px;
      background: rgba(255, 255, 255, .96);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 22px 60px rgba(38, 55, 88, .14);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 30px;
      color: var(--ink);
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -.02em;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 35px;
      height: 35px;
      place-items: center;
      color: white;
      background: linear-gradient(135deg, #6d82ff, var(--blue));
      border-radius: 11px;
      box-shadow: 0 6px 14px rgba(66, 99, 235, .27);
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 9px 0 25px;
      color: var(--muted);
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 16px;
      font-size: .85rem;
      font-weight: 700;
    }

    input {
      display: block;
      width: 100%;
      margin-top: 7px;
      padding: 12px 13px;
      color: var(--ink);
      background: #f8faff;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(66, 99, 235, .12);
    }

    button {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      color: white;
      background: var(--blue);
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
    }

    button:hover {
      background: var(--blue-dark);
    }

    .error {
      min-height: 20px;
      margin: 12px 0 0;
      color: #d64545;
      font-size: .82rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <form class="login-card" id="login-form">
    <a class="brand" href="login.html">
      <span class="brand-mark">LF</span>
      <span>ST LEARN</span>
    </a>
    <h1>Bienvenue sur ST LEARN</h1>
    <p class="subtitle">Connecte-toi pour accéder à ton espace d’apprentissage.</p>
    <label>
      Utilisateur
      <input id="username" name="username" type="text" autocomplete="username" required>
    </label>
    <label>
      Mot de passe
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Se connecter</button>
    <p class="error" id="login-error" role="alert"></p>
  </form>

  <script>
    document.querySelector("#login-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const username = document.querySelector("#username").value.trim();
      const password = document.querySelector("#password").value;
      const error = document.querySelector("#login-error");

      if (username === "admin" && password === "admin") {
        sessionStorage.setItem("lf-authenticated", "true");
        window.location.href = "index.html";
      } else {
        error.textContent = "Utilisateur ou mot de passe incorrect.";
      }
    });
  </script>
</body>
</html>
