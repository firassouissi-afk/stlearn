<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ressources — ST LEARN</title>
  <style>
    :root{--ink:#172033;--muted:#718096;--blue:#4263eb;--line:#e6ebf2;--bg:#f4f7fb}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .navbar{display:flex;align-items:center;justify-content:space-between;min-height:72px;padding:0 7vw;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 18px #1c2a4610}
    .brand{display:flex;align-items:center;gap:11px;color:inherit;font-weight:800;text-decoration:none}.brand-mark{display:grid;width:35px;height:35px;place-items:center;color:#fff;background:linear-gradient(135deg,#6d82ff,var(--blue));border-radius:11px}
    .logout,.back{padding:9px 13px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:9px;cursor:pointer;font:inherit;font-size:.8rem;font-weight:700}.back{color:var(--blue);text-decoration:none}
    main{width:min(1120px,calc(100% - 36px));margin:auto;padding:55px 0 75px}.eyebrow{margin:0 0 10px;color:var(--blue);font-size:.75rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(2.2rem,5vw,3.8rem);letter-spacing:-.055em;line-height:1}.intro{max-width:650px;margin:17px 0 40px;color:var(--muted);line-height:1.6}
    .resource-section{margin-top:30px}.section-title{margin:0 0 14px;font-size:1.3rem}.resources{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
    .resource{display:flex;flex-direction:column;gap:12px;padding:18px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 28px #2637580f}.resource img{width:100%;height:220px;object-fit:contain;background:#f8faff;border-radius:10px;cursor:zoom-in;transition:opacity .2s}.resource img:hover{opacity:.82}.resource-name{font-weight:700;word-break:break-word}.resource a{color:var(--blue);font-size:.86rem;font-weight:700;text-decoration:none}.resource-pdf{width:100%;height:560px;border:0;border-radius:10px;background:#eef1f5}.resource-text{max-height:560px;min-height:180px;margin:0;padding:16px;overflow:auto;color:var(--ink);background:#f8faff;border-radius:10px;font:0.88rem/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}
    .lightbox[hidden]{display:none}.lightbox{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:78px 24px 24px;background:#080d19e6}.lightbox-content{display:flex;width:min(1100px,100%);height:100%;align-items:center;justify-content:center;overflow:auto;border-radius:14px}.lightbox-image{max-width:100%;max-height:100%;transform-origin:center;cursor:grab;user-select:none}.lightbox-image:active{cursor:grabbing}.lightbox-toolbar{position:fixed;top:20px;right:24px;display:flex;gap:7px}.lightbox-toolbar button{min-width:38px;height:38px;padding:0 10px;color:#fff;background:#ffffff24;border:1px solid #ffffff40;border-radius:9px;cursor:pointer;font-size:1rem;font-weight:700}.lightbox-toolbar button:hover{background:#ffffff40}
    footer{padding:0 0 35px;color:var(--muted);font-size:.8rem;text-align:center}@media(max-width:600px){.navbar{padding:0 18px}.back{display:none}main{width:calc(100% - 24px);padding-top:42px}}
  </style>
</head>
<body>
  <script>if(sessionStorage.getItem("lf-authenticated")!=="true")window.location.replace("login.html");</script>
  <nav class="navbar"><a class="brand" href="index.html"><span class="brand-mark">ST</span><span>ST LEARN</span></a><a class="back" href="index.html">Mes matières</a><button class="logout" id="logout" type="button">Déconnexion</button></nav>
  <main><p class="eyebrow">Bibliothèque de ressources</p><h1 id="title"></h1><p class="intro" id="intro"></p><div id="content"></div></main>
  <footer>Site réalisé par Firas Souissi · ST LEARN</footer>
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Image agrandie">
    <div class="lightbox-toolbar"><button type="button" id="zoom-out" aria-label="Réduire">−</button><button type="button" id="zoom-reset" aria-label="Réinitialiser le zoom">100%</button><button type="button" id="zoom-in" aria-label="Agrandir">+</button><button type="button" id="lightbox-close" aria-label="Fermer">×</button></div>
    <div class="lightbox-content"><img class="lightbox-image" id="lightbox-image" alt=""></div>
  </div>
  <script src="resource-manifest.js"></script>
  <script>
    const subject=subjects[new URLSearchParams(location.search).get("subject")];if(!subject){location.replace("index.html")}else{
      document.title=subject.title+" — ST LEARN";document.querySelector("#title").textContent=subject.title;document.querySelector("#intro").textContent=subject.intro;
      const content=document.querySelector("#content");const lightbox=document.querySelector("#lightbox");const lightboxImage=document.querySelector("#lightbox-image");let zoom=1;function updateZoom(){lightboxImage.style.transform=`scale(${zoom})`;document.querySelector("#zoom-reset").textContent=`${Math.round(zoom*100)}%`}function closeLightbox(){lightbox.hidden=true;document.body.style.overflow=""}
      subject.groups.forEach(([name,files])=>{const section=document.createElement("section");section.className="resource-section";section.innerHTML=`<h2 class="section-title">${name}</h2><div class="resources"></div>`;const grid=section.querySelector(".resources");files.forEach(path=>{const card=document.createElement("article");card.className="resource";const filename=path.split("/").pop();const url=encodeURI(""+path);if(/\.(jpg|jpeg|png|webp)$/i.test(path)){card.innerHTML=`<img src="${url}" alt="${filename}"><span class="resource-name">${filename}</span><a href="${url}" target="_blank" rel="noopener">Ouvrir l'image →</a>`;card.querySelector("img").addEventListener("click",()=>{lightboxImage.src=url;lightboxImage.alt=filename;zoom=1;updateZoom();lightbox.hidden=false;document.body.style.overflow="hidden"})}else if(/\.txt$/i.test(path)){card.innerHTML=`<span class="resource-name">${filename}</span><pre class="resource-text">Chargement…</pre>`;fetch(url).then(response=>{if(!response.ok)throw new Error(`Impossible de charger ${filename}`);return response.text()}).then(text=>{card.querySelector(".resource-text").textContent=text}).catch(error=>{card.querySelector(".resource-text").textContent=error.message})}else{card.innerHTML=`<span class="resource-name">${filename}</span><iframe class="resource-pdf" src="${url}" title="${filename}"></iframe>`}grid.append(card)});content.append(section)});
      document.querySelector("#zoom-in").addEventListener("click",()=>{zoom=Math.min(zoom+.25,4);updateZoom()});document.querySelector("#zoom-out").addEventListener("click",()=>{zoom=Math.max(zoom-.25,.5);updateZoom()});document.querySelector("#lightbox-close").addEventListener("click",closeLightbox);document.querySelector("#lightbox").addEventListener("click",event=>{if(event.target===lightbox)closeLightbox()});document.addEventListener("keydown",event=>{if(event.key==="Escape")closeLightbox()});
    }
    document.querySelector("#logout").addEventListener("click",()=>{sessionStorage.removeItem("lf-authenticated");location.replace("login.html")});
  </script>
</body>
</html>
